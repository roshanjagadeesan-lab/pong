<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONG</title>
<style>
  :root{
    --fg: #f2f2f2;
    --fg-dim: #6b6b6b;
    --bg: #000000;
    --amber: #f2f2f2;
    --radius: 10px;
    --radius-sm: 7px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#000;
    font-family: 'Courier New', Courier, monospace;
    color: var(--fg);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    background: #000000;
  }
  #stage{
    position:relative;
    width: 960px;
    max-width: 100vw;
  }
  #screenWrap{
    position:relative;
    border: 1px solid #333333;
    box-shadow:
      0 0 0 1px #000,
      0 20px 60px rgba(0,0,0,0.65),
      inset 0 0 30px rgba(0,0,0,0.6);
    background: var(--bg);
    border-radius: 14px;
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #000;
  }
  /* CRT scanline + flicker overlay */
  #scanlines{
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode: multiply;
  }
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  /* Overlays (menus) */
  .overlay{
    position:absolute; inset: 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 18px;
    background: rgba(8,8,8,1);
    text-align:center;
    padding: 28px 24px;
    z-index: 5;
  }
  .hidden{ display:none !important; }

  .title{
    font-size: 54px;
    font-weight:bold;
    letter-spacing: 10px;
    color: var(--fg);
    text-shadow: none;
    margin: 0;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  .subtitle{
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--fg-dim);
    margin-top:-10px;
  }
  .menu-label{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--fg-dim);
    text-shadow: none;
    margin-bottom: 4px;
  }
  .btn-row{
    display:flex; flex-wrap:wrap; gap: 12px; justify-content:center;
    max-width: 760px;
  }
  button.retro-btn{
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 12px 22px;
    background: rgba(255,255,255,0.03);
    color: var(--fg);
    border: 1px solid rgba(242,242,242,0.55);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-shadow: none;
    box-shadow: none;
    transition: transform 0.12s cubic-bezier(.2,.8,.2,1), background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  button.retro-btn:hover, button.retro-btn:focus-visible{
    background: var(--fg);
    color: #000000;
    border-color: var(--fg);
    outline:none;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255,255,255,0.12);
  }
  button.retro-btn:active{
    transform: translateY(0px) scale(0.98);
    box-shadow: none;
  }
  button.retro-btn.amber{
    color: var(--fg-dim);
    border-color: rgba(255,255,255,0.25);
    text-shadow: none;
    box-shadow: none;
    background: transparent;
  }
  button.retro-btn.amber:hover{
    background: rgba(255,255,255,0.08);
    color: var(--fg);
    border-color: rgba(255,255,255,0.5);
    box-shadow: none;
  }

  select.retro-select{
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    color: var(--fg);
    border: 1px solid rgba(242,242,242,0.4);
    border-radius: var(--radius-sm);
    cursor: pointer;
    min-width: 260px;
    text-align: center;
    text-align-last: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  select.retro-select:hover{
    border-color: rgba(242,242,242,0.7);
  }
  select.retro-select:focus{
    outline: none;
    background: #141414;
    border-color: var(--fg);
  }
  select.retro-select option{
    background: #000000;
    color: var(--fg);
  }
  .diff-desc{
    font-size: 11px;
    color: var(--fg-dim);
    max-width: 640px;
    line-height: 1.6;
    letter-spacing: 1px;
  }
  .controls-hint{
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 2px;
    line-height: 1.8;
  }
  .blink{
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .big-msg{
    font-size: 30px;
    letter-spacing: 4px;
    text-shadow: none;
  }
  .small-note{
    font-size: 12px;
    color: var(--fg-dim);
    letter-spacing: 2px;
  }

  #footerHint{
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--fg-dim);
    text-align:center;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="screenWrap">
    <canvas id="game" width="480" height="300"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="overlay">
      <h1 class="title">PONG</h1>
      <div class="menu-label">SELECT MODE</div>
      <div class="btn-row">
        <button class="retro-btn" id="btn1P">1 PLAYER</button>
        <button class="retro-btn" id="btn2P">2 PLAYERS</button>
      </div>
    </div>

    <!-- MATCH SETTINGS MENU (difficulty + time control + tiebreaker) -->
    <div id="diffMenu" class="overlay hidden">
      <div class="menu-label">MATCH SETTINGS</div>
      <div id="diffSection">
        <div class="menu-label" style="font-size:11px;">DIFFICULTY</div>
        <select class="retro-select" id="diffSelect"></select>
        <div class="diff-desc" id="diffDesc">Choose an opponent skill level.</div>
      </div>
      <div>
        <div class="menu-label" style="font-size:11px;">TIME CONTROL</div>
        <select class="retro-select" id="timeSelect"></select>
      </div>
      <div id="tiebreakSection">
        <div class="menu-label" style="font-size:11px;">IF TIED WHEN CLOCK HITS ZERO</div>
        <select class="retro-select" id="tiebreakSelect"></select>
      </div>
      <div class="btn-row">
        <button class="retro-btn" id="btnStart1P">START MATCH</button>
        <button class="retro-btn amber" id="btnBackToMain">&larr; BACK</button>
      </div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div id="pauseMenu" class="overlay hidden">
      <div class="big-msg">PAUSED</div>
      <div class="btn-row">
        <button class="retro-btn" id="btnResume">RESUME</button>
        <button class="retro-btn amber" id="btnQuitToMenu">MAIN MENU</button>
      </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameOverMenu" class="overlay hidden">
      <div class="big-msg" id="winnerText" style="color:var(--amber);">PLAYER 1 WINS</div>
      <div class="small-note" id="finalScoreText">7 &ndash; 3</div>
      <div class="btn-row">
        <button class="retro-btn" id="btnRematch">REMATCH</button>
        <button class="retro-btn amber" id="btnBackMain2">MAIN MENU</button>
      </div>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdownOverlay" class="overlay hidden" style="background:rgba(0,4,0,0.0); pointer-events:none;">
      <div class="big-msg" id="countdownText" style="font-size:80px;">3</div>
    </div>
  </div>
  <div id="footerHint">PAUSE: SPACE OR P &middot; MENU: ESC</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Canvas / core setup ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;

  const COLORS = {
    fg: '#f2f2f2',
    fgDim: '#555555',
    amber: '#f2f2f2',
    ball: '#ffffff',
    bg: '#000000'
  };

  // ---------- Audio (WebAudio retro beeps) ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
    }
  }
  function beep(freq, dur, type, vol){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime((vol!==undefined?vol:0.15), t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }
  const sfx = {
    paddle: ()=>beep(220, 0.06, 'square', 0.18),
    wall:   ()=>beep(140, 0.05, 'square', 0.14),
    score:  ()=>beep(90, 0.35, 'sawtooth', 0.2),
    win:    ()=>{ beep(523,0.12,'square',0.2); setTimeout(()=>beep(659,0.12,'square',0.2),120); setTimeout(()=>beep(784,0.25,'square',0.22),240); },
    countdown: (f)=>beep(f, 0.1, 'square', 0.15),
    boost:  ()=>{ beep(340, 0.05, 'sawtooth', 0.22); setTimeout(()=>beep(560, 0.08, 'square', 0.22), 35); },
  };

  // ---------- Game constants ----------
  const PADDLE_W = 8, PADDLE_H = 50;
  const PADDLE_MARGIN = 14;
  const BALL_SIZE = 8;
  const WIN_SCORE = 7;
  const TIEBREAK_WIN_SCORE = 3;
  const TIEBREAK_TIME_SECONDS = 60;
  const SUDDEN_DEATH_WIN_SCORE = 1;
  const MAX_BALL_SPEED = 10;
  const BALL_SPEEDUP = 1.02;

  const TIME_CONTROLS = [
    { key: 'none', label: 'NO LIMIT', seconds: null },
    { key: '60',   label: '1 MINUTE', seconds: 60 },
    { key: '120',  label: '2 MINUTES', seconds: 120 },
    { key: '180',  label: '3 MINUTES', seconds: 180 },
    { key: '300',  label: '5 MINUTES', seconds: 300 },
    { key: '600',  label: '10 MINUTES', seconds: 600 }
  ];
  const TIEBREAK_RULES = [
    { key: 'draw',     label: 'CALL IT A DRAW' },
    { key: 'tiebreak', label: 'TIEBREAKER (FIRST TO 3)' }
  ];

  // ---------- Game state ----------
  let mode = null;        // '1P' | '2P'
  let difficulty = null;  // key into DIFFICULTIES
  let state = 'menu';     // 'menu' | 'diff' | 'countdown' | 'playing' | 'paused' | 'gameover'
  let animId = null;
  let lastTime = 0;

  let timeControlSeconds = null; // null = no limit
  let tiebreakerRule = 'tiebreak'; // 'draw' | 'tiebreak'
  let matchTimeRemaining = null; // seconds remaining, null = no clock active
  let matchStage = 'normal'; // 'normal' | 'tiebreak' | 'suddendeath'
  let currentWinScore = WIN_SCORE;

  const keys = {};

  const paddleL = { x: PADDLE_MARGIN, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H, speed: 6, score: 0, trail: [], charge: 50 };
  const paddleR = { x: W - PADDLE_MARGIN - PADDLE_W, y: H/2 - PADDLE_H/2, w: PADDLE_W, h: PADDLE_H, speed: 6, score: 0, trail: [], charge: 50 };

  const ball = { x: W/2, y: H/2, w: BALL_SIZE, h: BALL_SIZE, vx: 0, vy: 0, speed: 4.4, trail: [], boosted: false, boostBaseline: 4.4 };

  // ---------- Power shot ----------
  // Press D (while steering with WASD) or the Right arrow (while steering with arrows) at the
  // instant the ball meets your paddle for a speed-boosted "power shot". The boost fades back
  // to normal once the opponent returns it, and bleeds off partially (not fully) on wall bounces.
  const POWER_SHOT_WINDOW_MS = 130;   // how close to the hit the press has to land
  const POWER_SHOT_MULTIPLIER = 1.7;  // speed multiplier applied on a successful power shot
  const MAX_BOOSTED_SPEED = 24;       // boosted balls can exceed the normal speed cap, more so as shots compound
  const WALL_BOUNCE_DECAY = 0.75;     // fraction of the *extra* boosted speed kept after a wall bounce
  const BOOST_TRAIL_MIN_EXTRA = 0.4;  // once the leftover boost drops below this, treat it as spent
  let lastDPressTime = -Infinity;
  let lastRightPressTime = -Infinity;

  // Power shot charge meter: each paddle has its own 0-100 meter (starts at 50) so power
  // shots can't be spammed. A power shot costs 20 charge and won't fire below that.
  const POWER_SHOT_CHARGE_COST = 20;
  const CHARGE_GAIN_ON_HIT = 5;             // normal successful return
  const CHARGE_GAIN_ON_POWER_RETURN = 10;   // returning an opponent's power shot plainly
  const CHARGE_TICKS = [20, 40, 60, 80, 100];

  let particles = []; // simple screen-shake / spark particles
  let screenShake = 0;

  // AI state — a reusable little bundle so the bot paddle can run its behavior cleanly.
  function makeAIState(){
    return { targetY: H/2, updateCounter: 0, missThisRally: false, wasHeadingToAI: false, missDir: 1, velocity: 0 };
  }
  const singleAIState = makeAIState();  // used in 1P mode (paddleR)
  const AI_ACCEL_FRAC = 0.35;   // paddle ramps up to top speed over ~3 frames instead of snapping instantly

  // Rally fatigue: every paddle exchange in the current rally nudges the AI's effective
  // difficulty down (max 2 tiers, capped, faded in gradually — not a sudden step change).
  let rallyHitCount = 0;
  const RALLY_HITS_PER_TIER_DROP = 20;
  const RALLY_HITS_PER_TIER_DROP_IMPOSSIBLE_FAMILY = 40; // Impossible, Very/Extremely Impossible fatigue at 40 hits per tier
  const RALLY_HITS_PER_TIER_DROP_IMPOSSIBLY_IMPOSSIBLE = 80; // Impossibly Impossible fatigues most slowly
  const RALLY_MAX_TIER_DROP = 2;

  // ---------- Difficulty definitions ----------
  // reaction: frames between AI re-evaluating target (higher = slower to react)
  // error: max random pixel offset added to prediction (higher = worse aim)
  // speed: paddle max speed
  // predictive: whether AI simulates bounces to predict landing y
  // missChance: chance (0-1), rolled once per rally, that the AI will fail to return the ball this point
  const DIFFICULTIES = {
    extremelyeasy:{ label: 'EXTREMELY EASY', speed: 2.0, error: 190, reaction: 42, lag: 12, wobbleCap: 10, calcNoise: 16, bouncePenalty: 12, predictive:false, missChance: 0.25,  powerShotChance: 0,    desc: "The CPU barely knows the rules. Wanders, hesitates, and whiffs constantly. As easy as it gets." },
    veryeasy:   { label: 'VERY EASY',      speed: 2.6, error: 150, reaction: 34, lag: 12, wobbleCap: 9,  calcNoise: 13, bouncePenalty: 10, predictive:false, missChance: 0.15,  powerShotChance: 0,    desc: "The CPU barely tries. Slow, clumsy, and often looks the wrong way. Great for warming up." },
    easy:       { label: 'EASY',           speed: 3.6, error: 100, reaction: 24, lag: 12, wobbleCap: 8,  calcNoise: 10, bouncePenalty: 8,  predictive:false, missChance: 0.12,  powerShotChance: 0,    desc: "A gentle opponent. Reacts late and aims loosely — good for learning the controls." },
    mediumeasy: { label: 'MEDIUM EASY',    speed: 4.3, error: 75,  reaction: 18, lag: 9,  wobbleCap: 6,  calcNoise: 7,  bouncePenalty: 6,  predictive:false, missChance: 0.10,  powerShotChance: 0.10, desc: "A step up from Easy. Starting to track the ball better, but still a bit sloppy." },
    medium:     { label: 'MEDIUM',         speed: 5.0, error: 55,  reaction: 14, lag: 9,  wobbleCap: 5,  calcNoise: 5,  bouncePenalty: 5,  predictive:true,  missChance: 0.08,  powerShotChance: 0.10, desc: "A fair fight. Tracks the ball reasonably well but isn't perfect under pressure." },
    mediumhard: { label: 'MEDIUM HARD',    speed: 5.8, error: 40,  reaction: 11, lag: 9,  wobbleCap: 4,  calcNoise: 3,  bouncePenalty: 4,  predictive:true,  missChance: 0.06,  powerShotChance: 0.10, desc: "Noticeably tougher than Medium. Fewer mistakes and quicker recovery." },
    hard:       { label: 'HARD',           speed: 6.6, error: 28,  reaction: 8,  lag: 6,  wobbleCap: 5,  calcNoise: 4,  bouncePenalty: 3,  predictive:true,  missChance: 0.04,  powerShotChance: 0.20, desc: "Sharp reflexes and decent prediction, but even Hard bots fumble a tricky bounce now and then." },
    veryhard:   { label: 'VERY HARD',      speed: 8.2, error: 14,  reaction: 4,  lag: 6,  wobbleCap: 3,  calcNoise: 2,  bouncePenalty: 2,  predictive:true,  missChance: 0.02,  powerShotChance: 0.20, desc: "Fast and precise, though heavily-bounced shots can still throw off its read." },
    extreme:    { label: 'EXTREMELY HARD', speed: 9.8, error: 5,   reaction: 2,  lag: 6,  wobbleCap: 2,  calcNoise: 1,  bouncePenalty: 1,  predictive:true,  missChance: 0.01,  powerShotChance: 0.20, desc: "Near-perfect tracking with blistering paddle speed. Very few openings." },
    impossible: { label: 'IMPOSSIBLE',     speed: 12.5,error: 0,   reaction: 1,  lag: 3,  wobbleCap: 0,  calcNoise: 0,  bouncePenalty: 0,  predictive:true,  missChance: 0.005,    powerShotChance: 0.40, desc: "Flawless prediction, maximum speed, unaffected by bounces. The CPU almost never misses." },
    veryimpossible:      { label: 'VERY IMPOSSIBLE',      speed: 14,  error: 0, reaction: 1, lag: 2, wobbleCap: 0, calcNoise: 0, bouncePenalty: 0, predictive:true, missChance: 0.001,    powerShotChance: 0.50, desc: "Faster and even less forgiving than Impossible. Openings are vanishingly rare." },
    extremelyimpossible: { label: 'EXTREMELY IMPOSSIBLE', speed: 16,  error: 0, reaction: 1, lag: 1, wobbleCap: 0, calcNoise: 0, bouncePenalty: 0, predictive:true, missChance: 0.0001,   powerShotChance: 0.60, desc: "Blistering speed with an instant read on every ball. Essentially unbeatable." },
    impossiblyimpossible:{ label: 'IMPOSSIBLY IMPOSSIBLE',speed: 20,  error: 0, reaction: 1, lag: 0, wobbleCap: 0, calcNoise: 0, bouncePenalty: 0, predictive:true, missChance: 0.000001, powerShotChance: 0.80, desc: "The theoretical ceiling. Never fatigues, never slows down, never misses." }
  };

  const NUMERIC_TIER_FIELDS = ['speed','reaction','lag','wobbleCap','calcNoise','bouncePenalty','missChance'];

  function lerp(a, b, t){ return a + (b - a) * t; }

  // Returns the difficulty stats the AI should actually play with right now. As a rally
  // drags on, the AI gradually fades toward a weaker tier (never more than 2 tiers down).
  // Most tiers fully fade in one tier drop every RALLY_HITS_PER_TIER_DROP hits; Impossible,
  // Very Impossible, and Extremely Impossible fatigue slower (every 40 hits); Impossibly
  // Impossible fatigues slowest (every 80 hits).
  function getEffectiveDifficulty(){
    const base = DIFFICULTIES[difficulty];

    const baseIndex = DIFFICULTY_ORDER.indexOf(difficulty);
    let hitsPerTier = RALLY_HITS_PER_TIER_DROP;
    if(difficulty === 'impossible' || difficulty === 'veryimpossible' || difficulty === 'extremelyimpossible'){
      hitsPerTier = RALLY_HITS_PER_TIER_DROP_IMPOSSIBLE_FAMILY;
    } else if(difficulty === 'impossiblyimpossible'){
      hitsPerTier = RALLY_HITS_PER_TIER_DROP_IMPOSSIBLY_IMPOSSIBLE;
    }

    const dropAmount = clamp(rallyHitCount / hitsPerTier, 0, RALLY_MAX_TIER_DROP);
    const d0 = Math.floor(dropAmount);
    const d1 = Math.min(d0 + 1, RALLY_MAX_TIER_DROP);
    const frac = dropAmount - d0;

    const idxA = clamp(baseIndex - d0, 0, DIFFICULTY_ORDER.length - 1);
    const idxB = clamp(baseIndex - d1, 0, DIFFICULTY_ORDER.length - 1);
    const statsA = DIFFICULTIES[DIFFICULTY_ORDER[idxA]];
    const statsB = DIFFICULTIES[DIFFICULTY_ORDER[idxB]];

    if(idxA === idxB) return statsA;

    const effective = {};
    NUMERIC_TIER_FIELDS.forEach(key => {
      effective[key] = lerp(statsA[key], statsB[key], frac);
    });
    effective.predictive = frac < 0.5 ? statsA.predictive : statsB.predictive;
    effective.label = base.label;
    effective.desc = base.desc;
    return effective;
  }

  // ---------- UI Elements ----------
  const mainMenu = document.getElementById('mainMenu');
  const diffMenu = document.getElementById('diffMenu');
  const pauseMenu = document.getElementById('pauseMenu');
  const gameOverMenu = document.getElementById('gameOverMenu');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const countdownText = document.getElementById('countdownText');
  const diffSelect = document.getElementById('diffSelect');
  const diffDesc = document.getElementById('diffDesc');
  const diffSection = document.getElementById('diffSection');
  const timeSelect = document.getElementById('timeSelect');
  const tiebreakSection = document.getElementById('tiebreakSection');
  const tiebreakSelect = document.getElementById('tiebreakSelect');
  const winnerText = document.getElementById('winnerText');
  const finalScoreText = document.getElementById('finalScoreText');

  // Build difficulty dropdown options
  const DIFFICULTY_ORDER = ['extremelyeasy','veryeasy','easy','mediumeasy','medium','mediumhard','hard','veryhard','extreme','impossible','veryimpossible','extremelyimpossible','impossiblyimpossible'];

  DIFFICULTY_ORDER.forEach(key => {
    const d = DIFFICULTIES[key];
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = d.label;
    diffSelect.appendChild(opt);
  });
  diffSelect.value = 'medium';
  diffDesc.textContent = DIFFICULTIES['medium'].desc;
  diffSelect.addEventListener('change', ()=>{
    diffDesc.textContent = DIFFICULTIES[diffSelect.value].desc;
  });

  // Build time control dropdown options
  TIME_CONTROLS.forEach(tc => {
    const opt = document.createElement('option');
    opt.value = tc.key;
    opt.textContent = tc.label;
    timeSelect.appendChild(opt);
  });
  timeSelect.value = 'none';

  // Build tiebreaker dropdown options
  TIEBREAK_RULES.forEach(tr => {
    const opt = document.createElement('option');
    opt.value = tr.key;
    opt.textContent = tr.label;
    tiebreakSelect.appendChild(opt);
  });
  tiebreakSelect.value = 'tiebreak';

  function refreshTiebreakVisibility(){
    if(timeSelect.value === 'none'){
      tiebreakSection.classList.add('hidden');
    } else {
      tiebreakSection.classList.remove('hidden');
    }
  }
  refreshTiebreakVisibility();
  timeSelect.addEventListener('change', refreshTiebreakVisibility);

  document.getElementById('btnStart1P').addEventListener('click', ()=>{
    ensureAudio();
    if(mode === '1P') difficulty = diffSelect.value;
    const tc = TIME_CONTROLS.find(t => t.key === timeSelect.value);
    timeControlSeconds = tc ? tc.seconds : null;
    tiebreakerRule = tiebreakSelect.value;
    startMatch();
  });

  function showOnly(el){
    [mainMenu, diffMenu, pauseMenu, gameOverMenu].forEach(o => o.classList.add('hidden'));
    if(el) el.classList.remove('hidden');
  }

  document.getElementById('btn1P').addEventListener('click', ()=>{
    ensureAudio();
    mode = '1P';
    diffSection.classList.remove('hidden');
    diffDesc.textContent = DIFFICULTIES[diffSelect.value].desc;
    showOnly(diffMenu);
    state = 'diff';
  });
  document.getElementById('btn2P').addEventListener('click', ()=>{
    ensureAudio();
    mode = '2P';
    diffSection.classList.add('hidden');
    showOnly(diffMenu);
    state = 'diff';
  });
  document.getElementById('btnBackToMain').addEventListener('click', ()=>{
    showOnly(mainMenu);
    state = 'menu';
  });
  document.getElementById('btnResume').addEventListener('click', ()=>{
    resumeGame();
  });
  document.getElementById('btnQuitToMenu').addEventListener('click', ()=>{
    goToMainMenu();
  });
  document.getElementById('btnRematch').addEventListener('click', ()=>{
    startMatch();
  });
  document.getElementById('btnBackMain2').addEventListener('click', ()=>{
    goToMainMenu();
  });

  // ---------- Input ----------
  window.addEventListener('keydown', (e)=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;

    if(e.key === 'd' || e.key === 'D' || e.key=== 'a' || e.key === 'A'){
      lastDPressTime = performance.now();
    }
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      lastRightPressTime = performance.now();
    }

    if(e.key === ' ' || e.key === 'p' || e.key === 'P'){
      ensureAudio();
      if(state === 'playing'){ pauseGame(); }
      else if(state === 'paused'){ resumeGame(); }
    }
    if(e.key === 'Escape'){
      if(state === 'playing' || state === 'paused'){ goToMainMenu(); }
    }
    if(e.key === 'Enter'){
      if(state === 'gameover'){ startMatch(); }
    }
  });
  window.addEventListener('keyup', (e)=>{
    keys[e.key] = false;
  });

  // ---------- Match setup ----------
  function resetPositions(servingSide){
    paddleL.y = H/2 - PADDLE_H/2;
    paddleR.y = H/2 - PADDLE_H/2;
    ball.x = W/2; ball.y = H/2;
    ball.speed = 4.4;
    ball.boosted = false;
    ball.boostBaseline = 4.4;
    const angle = (Math.random() * 0.5 - 0.25); // radians
    const dir = servingSide === 'L' ? -1 : 1;
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed * (Math.random()<0.5?-1:1);
    ball.trail = [];
    rallyHitCount = 0;
  }

  function startMatch(){
    paddleL.score = 0; paddleR.score = 0;
    paddleL.charge = 50; paddleR.charge = 50;
    if(mode === '1P'){
      const d = DIFFICULTIES[difficulty];
      paddleR.speed = d.speed;
    } else {
      paddleR.speed = 6.4;
    }
    paddleL.speed = 6.4;

    singleAIState.missThisRally = false;
    singleAIState.wasHeadingToAI = false;
    singleAIState.missDir = 1;
    singleAIState.velocity = 0;

    matchStage = 'normal';
    currentWinScore = WIN_SCORE;
    matchTimeRemaining = timeControlSeconds;
    showOnly(null);
    resetPositions(Math.random() < 0.5 ? 'L' : 'R');
    beginCountdown(3, ()=>{
      state = 'playing';
      lastTime = performance.now();
      if(!animId) animId = requestAnimationFrame(loop);
    });
  }

  function beginCountdown(seconds, cb){
    state = 'countdown';
    countdownOverlay.classList.remove('hidden');
    let n = seconds;
    countdownText.textContent = n;
    sfx.countdown(440);
    const iv = setInterval(()=>{
      n--;
      if(n > 0){
        countdownText.textContent = n;
        sfx.countdown(440);
      } else if(n === 0){
        countdownText.textContent = 'GO!';
        sfx.countdown(660);
      } else {
        clearInterval(iv);
        countdownOverlay.classList.add('hidden');
        cb();
      }
    }, 650);
  }

  function pauseGame(){
    if(state !== 'playing') return;
    state = 'paused';
    showOnly(pauseMenu);
  }
  function resumeGame(){
    if(state !== 'paused') return;
    showOnly(null);
    state = 'playing';
    lastTime = performance.now();
  }
  function goToMainMenu(){
    state = 'menu';
    if(animId){ cancelAnimationFrame(animId); animId = null; }
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    showOnly(mainMenu);
  }

  function endMatch(reason){
    state = 'gameover';
    if(reason === 'draw'){
      winnerText.textContent = 'DRAW';
      winnerText.style.color = '#f2f2f2';
    } else {
      const p1won = paddleL.score > paddleR.score;
      let text;
      if(reason === 'time'){
        text = p1won ? (mode === '1P' ? 'YOU WIN ON TIME!' : 'PLAYER 1 WINS ON TIME') : (mode === '1P' ? 'CPU WINS ON TIME' : 'PLAYER 2 WINS ON TIME');
      } else {
        text = p1won ? (mode === '1P' ? 'YOU WIN!' : 'PLAYER 1 WINS') : (mode === '1P' ? 'CPU WINS' : 'PLAYER 2 WINS');
      }
      winnerText.textContent = text;
      winnerText.style.color = '#f2f2f2';
    }
    let suffix = '';
    if(matchStage === 'tiebreak') suffix = ' (TIEBREAKER)';
    else if(matchStage === 'suddendeath') suffix = ' (SUDDEN DEATH)';
    finalScoreText.textContent = paddleL.score + ' \u2013 ' + paddleR.score + suffix;
    if(reason !== 'draw') sfx.win();
    showOnly(gameOverMenu);
  }

  // ---------- AI ----------
  function predictBallY(targetX){
    // Simulate straight-line + wall bounce prediction from current ball position to targetX
    let simX = ball.x, simY = ball.y, simVX = ball.vx, simVY = ball.vy;
    let bounces = 0;
    if(simVX === 0) return { y: simY, bounces };
    // iterate in small time steps to catch bounces accurately
    const steps = 400;
    for(let i=0;i<steps;i++){
      simX += simVX;
      simY += simVY;
      if(simY <= 0){ simY = 0; simVY *= -1; bounces++; }
      else if(simY >= H - BALL_SIZE){ simY = H - BALL_SIZE; simVY *= -1; bounces++; }
      if((simVX > 0 && simX >= targetX) || (simVX < 0 && simX <= targetX)){
        return { y: simY, bounces };
      }
    }
    return { y: simY, bounces };
  }

  function runBotAI(paddle, aiState, d){
    aiState.updateCounter++;
    const shouldReact = ball.vx > 0; // only actively track when ball heads toward this side (right side)

    // Roll the miss chance once per rally, right as the ball starts heading this way
    if(shouldReact && !aiState.wasHeadingToAI){
      aiState.missThisRally = Math.random() < d.missChance;
      aiState.missDir = Math.random() < 0.5 ? -1 : 1;
    }
    aiState.wasHeadingToAI = shouldReact;

    if(aiState.updateCounter >= d.reaction + d.lag){
      aiState.updateCounter = 0;
      if(shouldReact){
        let predY, bounceCount;
        if(d.predictive){
          const result = predictBallY(paddle.x);
          predY = result.y;
          bounceCount = result.bounces;
        } else {
          predY = ball.y; // naive: just chase current ball y
          bounceCount = predictBallY(paddle.x).bounces; // still used to gauge trajectory complexity
        }
        // Weaker difficulties do the math less precisely — nudge the calculated
        // landing spot itself before deciding where to put the paddle.
        if(d.calcNoise > 0){
          predY += (Math.random()*2 - 1) * d.calcNoise;
        }
        // Everyone except Impossible reads bouncy trajectories worse — each wall
        // bounce between now and the paddle compounds a bit more uncertainty in.
        if(difficulty !== 'impossible' && bounceCount > 0){
          predY += (Math.random()*2 - 1) * bounceCount * d.bouncePenalty;
        }
        const exactTargetY = predY - PADDLE_H/2 + BALL_SIZE/2;

        if(aiState.missThisRally){
          // Reach for the ball and get close, but land just short so it slips past the edge.
          const safeMargin = PADDLE_H/2 - BALL_SIZE/2;
          const missBy = safeMargin + 4 + Math.random() * 10; // just enough to miss, not a wild whiff
          aiState.targetY = exactTargetY + aiState.missDir * missBy;
        } else {
          // Guaranteed return: only a small, difficulty-scaled wobble that always stays
          // within the paddle's catch zone, so nothing but a rolled miss can lose the point.
          const wobble = d.wobbleCap;
          const jitter = (Math.random()*2 - 1) * wobble;
          aiState.targetY = exactTargetY + jitter;
        }
      } else {
        // Ball moving away — drift back to center slowly (human-like idle)
        aiState.targetY = H/2 - PADDLE_H/2 + (Math.random()*2-1)*10;
      }
    }

    // Move paddle towards its target with a bit of acceleration lag instead of snapping instantly —
    // the paddle ramps up to its top speed over a few frames, like real reflex/input latency.
    const desiredVel = clamp(aiState.targetY - paddle.y, -d.speed, d.speed);
    const accel = Math.max(d.speed * AI_ACCEL_FRAC, 0.6);
    if(aiState.velocity < desiredVel){
      aiState.velocity = Math.min(aiState.velocity + accel, desiredVel);
    } else if(aiState.velocity > desiredVel){
      aiState.velocity = Math.max(aiState.velocity - accel, desiredVel);
    }
    paddle.y += aiState.velocity;
    paddle.y = clamp(paddle.y, 0, H - PADDLE_H);
  }

  function updateAI(){
    // 1P mode: single bot paddle on the right
    const d = getEffectiveDifficulty();
    runBotAI(paddleR, singleAIState, d);
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  // ---------- Physics / update ----------
  function updatePlayers(dt){
    // Player 1 (W/S) always human; in 1P mode arrow keys also work for Player 1
    if(keys['w'] || keys['W']) paddleL.y -= paddleL.speed;
    if(keys['s'] || keys['S']) paddleL.y += paddleL.speed;
    if(mode === '1P'){
      if(keys['ArrowUp']) paddleL.y -= paddleL.speed;
      if(keys['ArrowDown']) paddleL.y += paddleL.speed;
    }
    paddleL.y = clamp(paddleL.y, 0, H - PADDLE_H);

    if(mode === '2P'){
      if(keys['ArrowUp']) paddleR.y -= paddleR.speed;
      if(keys['ArrowDown']) paddleR.y += paddleR.speed;
      paddleR.y = clamp(paddleR.y, 0, H - PADDLE_H);
    } else {
      updateAI();
    }
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function updateBall(){
    ball.trail.push({x: ball.x, y: ball.y});
    if(ball.trail.length > 8) ball.trail.shift();

    ball.x += ball.vx;
    ball.y += ball.vy;

    // top/bottom walls
    if(ball.y <= 0){
      ball.y = 0; ball.vy *= -1; sfx.wall(); spawnSpark(ball.x, 0);
      handleWallBounceSpeedLoss();
    } else if(ball.y >= H - BALL_SIZE){
      ball.y = H - BALL_SIZE; ball.vy *= -1; sfx.wall(); spawnSpark(ball.x, H);
      handleWallBounceSpeedLoss();
    }

    // paddle collisions
    if(ball.vx < 0 && rectsOverlap(ball.x, ball.y, BALL_SIZE, BALL_SIZE, paddleL.x, paddleL.y, paddleL.w, paddleL.h)){
      handlePaddleHit(paddleL, 1);
    } else if(ball.vx > 0 && rectsOverlap(ball.x, ball.y, BALL_SIZE, BALL_SIZE, paddleR.x, paddleR.y, paddleR.w, paddleR.h)){
      handlePaddleHit(paddleR, -1);
    }

    // scoring
    if(ball.x < -20){
      paddleR.score++;
      sfx.score();
      screenShake = 8;
      checkWinOrServe('R');
    } else if(ball.x > W + 20){
      paddleL.score++;
      sfx.score();
      screenShake = 8;
      checkWinOrServe('L');
    }
  }

  function handlePaddleHit(paddle, dirSign){
    // reposition ball just outside paddle to avoid sticking
    ball.x = dirSign === 1 ? paddle.x + paddle.w : paddle.x - BALL_SIZE;

    const incomingSpeed = Math.hypot(ball.vx, ball.vy);
    const wasBoosted = ball.boosted;
    // What this hit would settle at if returned plainly (this is also what a boosted
    // ball reverts to if it's returned WITHOUT a follow-up power shot).
    const normalReturnBase = wasBoosted ? ball.boostBaseline : incomingSpeed;

    const relativeIntersect = ((ball.y + BALL_SIZE/2) - (paddle.y + paddle.h/2)) / (paddle.h/2); // -1..1
    const bounceAngle = relativeIntersect * (Math.PI/3.2); // up to ~56 degrees

    // Power shot: press D (WASD steering) or the Right arrow (arrow-key steering) at the
    // instant the ball meets your paddle to launch a speed-boosted return. The AI can also
    // attempt one, at odds set by its difficulty. Either way it only goes through if this
    // paddle's charge meter has at least 20.
    const now = performance.now();
    let attemptedBoost = false;
    if(paddle === paddleL){
      if(Math.abs(now - lastDPressTime) <= POWER_SHOT_WINDOW_MS){
        attemptedBoost = true; lastDPressTime = -Infinity;
      } else if(mode === '1P' && Math.abs(now - lastRightPressTime) <= POWER_SHOT_WINDOW_MS){
        attemptedBoost = true; lastRightPressTime = -Infinity;
      }
    } else if(paddle === paddleR){
      if(mode === '2P' && Math.abs(now - lastRightPressTime) <= POWER_SHOT_WINDOW_MS){
        attemptedBoost = true; lastRightPressTime = -Infinity;
      } else if(mode === '1P'){
        if(Math.random() < DIFFICULTIES[difficulty].powerShotChance) attemptedBoost = true;
      }
    }

    const triggeredBoost = attemptedBoost && paddle.charge >= POWER_SHOT_CHARGE_COST;

    let newSpeed;
    if(triggeredBoost){
      if(wasBoosted){
        // Returning a power shot WITH a power shot compounds it — the rally keeps escalating.
        newSpeed = Math.min(incomingSpeed * BALL_SPEEDUP * POWER_SHOT_MULTIPLIER, MAX_BOOSTED_SPEED);
      } else {
        newSpeed = Math.min(normalReturnBase * BALL_SPEEDUP * POWER_SHOT_MULTIPLIER, MAX_BOOSTED_SPEED);
      }
      ball.boostBaseline = Math.min(normalReturnBase * BALL_SPEEDUP, MAX_BALL_SPEED);
      ball.boosted = true;
      sfx.boost();
      spawnSpark(ball.x, ball.y); // extra burst to punctuate the power shot
      paddle.charge = clamp(paddle.charge - POWER_SHOT_CHARGE_COST, 0, 100);
    } else {
      // A plain return drains any incoming boost back to normal.
      newSpeed = Math.min(normalReturnBase * BALL_SPEEDUP, MAX_BALL_SPEED);
      ball.boostBaseline = newSpeed;
      ball.boosted = false;
      // Charge builds up over time so it can't be spammed: a bigger reward for
      // calmly returning an opponent's power shot than for a routine hit.
      paddle.charge = clamp(paddle.charge + (wasBoosted ? CHARGE_GAIN_ON_POWER_RETURN : CHARGE_GAIN_ON_HIT), 0, 100);
    }

    ball.speed = newSpeed;
    ball.vx = dirSign * Math.cos(bounceAngle) * newSpeed;
    ball.vy = Math.sin(bounceAngle) * newSpeed;

    sfx.paddle();
    spawnSpark(ball.x, ball.y);
    screenShake = Math.max(screenShake, triggeredBoost ? 6 : 3);
    rallyHitCount++;
  }

  function handleWallBounceSpeedLoss(){
    // A boosted ball loses some — not all — of its extra speed on a wall bounce, for balance.
    if(!ball.boosted) return;
    const currentSpeed = Math.hypot(ball.vx, ball.vy);
    const extra = currentSpeed - ball.boostBaseline;
    if(extra <= 0){
      ball.boosted = false;
      ball.speed = currentSpeed;
      return;
    }
    const keptExtra = extra * WALL_BOUNCE_DECAY;
    const newSpeed = ball.boostBaseline + keptExtra;
    const scale = newSpeed / currentSpeed;
    ball.vx *= scale;
    ball.vy *= scale;
    ball.speed = newSpeed;
    if(keptExtra < BOOST_TRAIL_MIN_EXTRA){
      ball.boosted = false;
    }
  }

  function checkWinOrServe(loserSide){
    if(paddleL.score >= currentWinScore || paddleR.score >= currentWinScore){
      endMatch('score');
    } else {
      resetPositions(loserSide);
      // brief pause before ball moves again handled visually via serve delay
      state = 'serve-delay';
      setTimeout(()=>{ if(state === 'serve-delay') state = 'playing'; }, 700);
    }
  }

  function updateClock(dt){
    if(matchTimeRemaining === null) return;
    matchTimeRemaining -= dt / 1000;
    if(matchTimeRemaining <= 0){
      matchTimeRemaining = 0;
      handleClockExpired();
    }
  }

  function handleClockExpired(){
    if(matchStage === 'normal'){
      if(paddleL.score !== paddleR.score){
        endMatch('time');
      } else if(tiebreakerRule === 'draw'){
        endMatch('draw');
      } else {
        // Enter tiebreaker: reset score, 1-minute clock, first to 3 decides it
        matchStage = 'tiebreak';
        currentWinScore = TIEBREAK_WIN_SCORE;
        paddleL.score = 0; paddleR.score = 0;
        matchTimeRemaining = TIEBREAK_TIME_SECONDS;
        resetPositions(Math.random() < 0.5 ? 'L' : 'R');
        beginCountdown(5, ()=>{
          state = 'playing';
          lastTime = performance.now();
        });
      }
    } else if(matchStage === 'tiebreak'){
      if(paddleL.score !== paddleR.score){
        endMatch('time');
      } else {
        // Still tied after the tiebreaker minute: sudden death, first to 1, no clock
        matchStage = 'suddendeath';
        currentWinScore = SUDDEN_DEATH_WIN_SCORE;
        paddleL.score = 0; paddleR.score = 0;
        matchTimeRemaining = null;
        resetPositions(Math.random() < 0.5 ? 'L' : 'R');
        beginCountdown(5, ()=>{
          state = 'playing';
          lastTime = performance.now();
        });
      }
    }
  }

  // ---------- Particles (simple spark burst) ----------
  function spawnSpark(x, y){
    for(let i=0;i<6;i++){
      particles.push({
        x, y,
        vx: (Math.random()*2-1)*3,
        vy: (Math.random()*2-1)*3,
        life: 18,
        maxLife: 18
      });
    }
  }
  function updateParticles(){
    particles.forEach(p=>{ p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Render ----------
  function drawBackground(){
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0,0,W,H);

    // center dashed line
    ctx.strokeStyle = COLORS.fgDim;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPaddle(p, color){
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, p.h);
  }

  const CHARGE_BAR_WIDTH = 6;
  const CHARGE_BAR_TOP = 0;
  const CHARGE_BAR_BOTTOM = H;
  const CHARGE_BAR_HEIGHT = CHARGE_BAR_BOTTOM - CHARGE_BAR_TOP;

  function drawChargeBar(x, charge){
    // outline (starts completely empty/black, fills with white as charge rises)
    ctx.strokeStyle = COLORS.fgDim;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, CHARGE_BAR_TOP + 0.5, CHARGE_BAR_WIDTH, CHARGE_BAR_HEIGHT);

    const fillH = (clamp(charge, 0, 100) / 100) * CHARGE_BAR_HEIGHT;
    if(fillH > 0){
      ctx.fillStyle = COLORS.fg;
      ctx.fillRect(x, CHARGE_BAR_TOP + (CHARGE_BAR_HEIGHT - fillH), CHARGE_BAR_WIDTH, fillH);
    }

    // tick marks at 20/40/60/80/100 — lines spanning only the charge bar
    ctx.strokeStyle = COLORS.fgDim;
    ctx.lineWidth = 1;
    CHARGE_TICKS.forEach(pct => {
      const ty = Math.round(CHARGE_BAR_TOP + CHARGE_BAR_HEIGHT - (pct/100) * CHARGE_BAR_HEIGHT) + 0.5;
      ctx.beginPath();
      ctx.moveTo(x, ty);
      ctx.lineTo(x + CHARGE_BAR_WIDTH, ty);
      ctx.stroke();
    });
  }

  function drawBall(){
    if(ball.boosted){
      for(let i=0;i<ball.trail.length;i++){
        const t = ball.trail[i];
        const alpha = (i+1) / (ball.trail.length+2) * 0.55;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(Math.round(t.x), Math.round(t.y), BALL_SIZE, BALL_SIZE);
      }
    }
    ctx.fillStyle = COLORS.ball;
    ctx.fillRect(Math.round(ball.x), Math.round(ball.y), BALL_SIZE, BALL_SIZE);
  }

  function drawParticles(){
    particles.forEach(p=>{
      const a = p.life / p.maxLife;
      ctx.fillStyle = `rgba(255,176,0,${a})`;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    });
  }

  function drawDigit(str, x, y, color, size){
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(str, x, y);
  }

  function drawScores(){
    drawDigit(String(paddleL.score), W*0.25, 14, COLORS.fg, 28);
    drawDigit(String(paddleR.score), W*0.75, 14, mode === '1P' ? COLORS.amber : COLORS.fg, 28);
  }

  function drawLabels(){
    ctx.font = "9px 'Courier New', monospace";
    ctx.fillStyle = COLORS.fgDim;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(mode === '1P' ? 'YOU' : 'P1', W*0.25, 46);
    ctx.fillText(mode === '1P' ? DIFFICULTIES[difficulty].label : 'P2', W*0.75, 46);
  }

  function formatTime(t){
    t = Math.max(0, Math.ceil(t));
    const m = Math.floor(t / 60);
    const s = t % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function drawClock(){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = COLORS.fg;

    if(matchStage === 'suddendeath'){
      ctx.font = "10px 'Courier New', monospace";
      ctx.fillText('SUDDEN DEATH \u2014 FIRST TO 1', W/2, 4);
      return;
    }
    if(matchStage === 'tiebreak'){
      ctx.font = "10px 'Courier New', monospace";
      ctx.fillText('TIEBREAKER \u2014 FIRST TO 3', W/2, 4);
      if(matchTimeRemaining !== null){
        ctx.font = "12px 'Courier New', monospace";
        ctx.fillText(formatTime(matchTimeRemaining), W/2, 16);
      }
      return;
    }
    if(matchTimeRemaining === null) return;
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText(formatTime(matchTimeRemaining), W/2, 4);
  }

  function render(){
    ctx.save();
    if(screenShake > 0){
      const sx = (Math.random()*2-1) * screenShake * 0.5;
      const sy = (Math.random()*2-1) * screenShake * 0.5;
      ctx.translate(sx, sy);
      screenShake *= 0.85;
      if(screenShake < 0.3) screenShake = 0;
    }
    drawBackground();
    drawParticles();
    drawChargeBar(0, paddleL.charge);
    drawChargeBar(W - CHARGE_BAR_WIDTH, paddleR.charge);
    drawPaddle(paddleL, COLORS.fg);
    drawPaddle(paddleR, mode === '1P' ? COLORS.amber : COLORS.fg);
    drawBall();
    drawScores();
    drawLabels();
    drawClock();
    ctx.restore();
  }

  // ---------- Main loop ----------
  function loop(now){
    animId = requestAnimationFrame(loop);
    const dt = Math.min(32, now - lastTime);
    lastTime = now;

    if(state === 'playing'){
      updatePlayers(dt);
      updateBall();
      updateParticles();
      updateClock(dt);
    } else if(state === 'serve-delay'){
      updatePlayers(dt);
      updateParticles();
    } else if(state === 'countdown'){
      updateParticles();
    } else if(state === 'paused' || state === 'gameover'){
      // still let particles fade for visual polish
      updateParticles();
    }

    render();
  }

  // Initial idle render (menu backdrop)
  function idleRenderOnce(){
    resetPositions('L');
    ball.vx = 0; ball.vy = 0;
    render();
  }
  idleRenderOnce();

})();
</script>
</body>
